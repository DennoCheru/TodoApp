<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo</title>
</head>
<body>
    <h1>MY TODO APP</h1>
    <div class="container" id="mainContainer">
        <div id="projectsContainer" class="container">
            <h1>Projects</h1>
            <ul id="projects"></ul>
            <button id="addProject">Add Project</button>
        </div>
        <div id="todosContainer" class="container">
            <h1 id="header"></h1>
            <div id="todos"></div>
            <button id="addTodo">Add Todo</button>
        </div>
    </div>
    <dialog id="addProjectModal" closedby="any">
        <form action="" id="addProjectForm">
            <h2>Add Project</h2>
            <label for="projectName">Name</label>
            <input type="text" id="projectName" name="projectName" required>
            <button id="saveProject" type="submit">Save</button>
        </form>
    </dialog>
    <dialog id="addTodoModal" closedby="any">
        <form action="" id="addTodoForm">
            <h2 id="todoModalTitle">Add Todo</h2>

            <label for="todoTitle">Title</label>
            <input type="text" id="todoTitle" name="todoTitle" required>

            <label for="todoDescription">Description</label>
            <input type="text" id="todoDescription" name="todoDescription">

            <label for="todoDueDate">Due Date</label>
            <input type="date" id="todoDueDate" name="todoDueDate" required>

            <label for="todoPriority">Priority</label>
            <select name="todoPriority" id="todoPriority" required>
                <option value="">Please select a priority</option>
                <option value="high">High</option>
                <option value="medium">Medium</option>
                <option value="low">Low</option>
            </select>

            <label for="todoNotes">Notes</label>
            <textarea id="todoNotes" name="todoNotes"></textarea>
            <button id="saveTodo" type="submit">Save</button>
        </form>
    </dialog>
</body>
</html>
