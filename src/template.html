<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo</title>
</head>
<body>
    <div class="container" id="mainContainer">
        <div id="projectsContainer" class="container">
            <h1>Projects</h1>
            <ul id="projects"></ul>
            <button id="addProject">Add Project</button>
        </div>
        <div id="todosContainer" class="container">
            <h2 id="header"></h2>
            <div id="todos"></div>
            <button id="addTodo">Add Todo</button>
        </div>
    </div>
    <dialog id="addProjectModal" closedby="any">
        <form action="" id="addProjectForm">
            <h2>Add Project</h2>
            <label for="projectName"></label>
            <input type="text" id="projectName" name="projectName" required>
        </form>
        <button id="saveProject">Save</button>
    </dialog>
</body>
</html>
